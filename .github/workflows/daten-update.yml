name: Daten-Update & Veröffentlichung

on:
  schedule:
    - cron: "17 3 2 * *"   # jeden Monat am 2. um 03:17 UTC
  workflow_dispatch: {}     # zusätzlich per Knopfdruck ("Run workflow")
  push:
    branches: [main]
    paths: ["site/**"]      # App-Änderungen sofort veröffentlichen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          pip install duckdb overturemaps huggingface_hub
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: OpenStreetMap-Sportorte für Deutschland
        run: |
          curl -sSL -o germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          osmium tags-filter germany.osm.pbf nwr/sport nwr/leisure nwr/club nwr/amenity=dancing_school,school,college,university -o sport.osm.pbf --overwrite
          osmium tags-filter germany.osm.pbf w/highway=residential,living_street,unclassified,tertiary,secondary,primary,pedestrian,footway,path,cycleway,track,service -o hw.osm.pbf --overwrite
          rm germany.osm.pbf
          osmium tags-filter hw.osm.pbf w/name -o streets.osm.pbf --overwrite
          osmium export sport.osm.pbf -f geojsonseq --add-unique-id=type_id -o sport.geojsonseq --overwrite
          osmium export streets.osm.pbf -f geojsonseq --geometry-types=linestring -o streets.geojsonseq --overwrite
          python pipeline/build_osm.py sport.geojsonseq --streets streets.geojsonseq --out site/data/osm
          rm -f sport.osm.pbf hw.osm.pbf streets.osm.pbf sport.geojsonseq streets.geojsonseq

      - name: Orte für Deutschland erzeugen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional, für Foursquare
        run: python pipeline/build_places.py --out site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
