<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sportfinder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF7A1A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sportfinder">
<meta name="description" content="Sportart wählen und alle Möglichkeiten in der Nähe sehen: Vereine, freie Plätze, Studios und Hallen in ganz Deutschland – mit Bolle.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* =====================================================================
   Sportfinder V4 · Marke „Bolle“
   Ein Markenorange, eine Figur, griffige 3D-Knöpfe, runde Schrift.
   Bewegung nur, wenn etwas passiert: drücken, laden, finden, schaffen.
   ===================================================================== */
:root{
  color-scheme:light;
  --brand:#FF7A1A; --brand-dark:#D35400; --brand-btn:#E8590C; --brand-btn-edge:#A84006; --on-brand:#FFFFFF; /* Knopftext 18px/900 = groß, 3,58:1 */
  --brand-soft:#FFF0E3; --on-brand-soft:#8A3A00;
  --ink:#13233A; --muted:#6B7385; --line:#E6E8EE; --line-strong:#D5D9E2;
  --bg:#FFFFFF; --bg-soft:#F6F7FA; --card:#FFFFFF;
  --good:#2B8A3E; --good-soft:#E3F6E8; --bad:#D9480F;
  --scrim:rgb(19 35 58/.45);
  --r-s:12px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --font:'Nunito',ui-rounded,'SF Pro Rounded',-apple-system,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  --s-basketball:#FF7A2F; --s-fussball:#2EBD6B; --s-tischtennis:#3D8BFF; --s-yoga:#B79CFF; --s-fitness:#FF5C8A; --s-schwimmen:#3FC7E0;
  --s-klettern:#F2B53C; --s-tennis:#FFD84D; --s-volleyball:#FFAE94; --s-boxen:#F0503C; --s-laufen:#7FD6B4; --s-tanzen:#FF9BD2;
  --s-calisthenics:#A9B7CC; --s-badminton:#8FB8FF; --s-padel:#5BD1A0; --s-handball:#4FB7B9; --s-judo:#D2C2B0;
  --s-hockey:#FF7A2F; --s-rugby:#2EBD6B; --s-football:#3D8BFF; --s-baseball:#B79CFF; --s-cricket:#FF5C8A; --s-floorball:#3FC7E0; --s-ultimate:#F2B53C; --s-lacrosse:#FFD84D; --s-faustball:#FFAE94; --s-teqball:#F0503C; --s-roundnet:#7FD6B4; --s-footgolf:#FF9BD2; --s-squash:#A9B7CC; --s-pickleball:#8FB8FF; --s-pilates:#5BD1A0; --s-crossfit:#4FB7B9; --s-trampolin:#D2C2B0; --s-poledance:#FF5CC8; --s-aerial:#2EBD6B; --s-barre:#3D8BFF; --s-indoorcycling:#B79CFF; --s-ems:#FF5C8A; --s-jumping:#3FC7E0; --s-aquafitness:#F2B53C; --s-turnen:#FFD84D; --s-cheerleading:#FFAE94; --s-akrobatik:#F0503C; --s-taichi:#7FD6B4; --s-kraftsport:#FF9BD2; --s-parkour:#A9B7CC; --s-kampfsport:#8FB8FF; --s-karate:#5BD1A0; --s-taekwondo:#4FB7B9; --s-fechten:#D2C2B0; --s-ringen:#FF7A2F; --s-mma:#2EBD6B; --s-selbstverteidigung:#3D8BFF; --s-jujutsu:#B79CFF; --s-rudern:#FF5C8A; --s-kanu:#3FC7E0; --s-sup:#F2B53C; --s-segeln:#FFD84D; --s-tauchen:#FFAE94; --s-wasserball:#F0503C; --s-surfen:#7FD6B4; --s-windkite:#FF9BD2; --s-wakeboard:#A9B7CC; --s-radsport:#8FB8FF; --s-skaten:#5BD1A0; --s-golf:#4FB7B9; --s-minigolf:#D2C2B0; --s-discgolf:#FF7A2F; --s-reiten:#2EBD6B; --s-eislaufen:#3D8BFF; --s-bogen:#B79CFF; --s-schiessen:#FF5C8A; --s-triathlon:#3FC7E0; --s-wintersport:#F2B53C; --s-rodeln:#FFD84D; --s-slackline:#FFAE94; --s-motorsport:#F0503C; --s-luftsport:#7FD6B4; --s-curling:#FF9BD2; --s-hundesport:#A9B7CC; --s-bowling:#8FB8FF; --s-boule:#5BD1A0; --s-billard:#4FB7B9; --s-darts:#D2C2B0; --s-schach:#FF7A2F; --s-lasertag:#2EBD6B; --s-paintball:#3D8BFF; --s-tischfussball:#B79CFF; --s-cornhole:#FF5C8A;
  --sport:var(--s-basketball); --on-sport:#13233A;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F1F3F8; --muted:#A3AABB; --line:#2A3345; --line-strong:#364055;
  --bg:#111827; --bg-soft:#1A2232; --card:#161E2D; --brand-soft:#3A2414; --on-brand-soft:#FFC59A;
  --good-soft:#163524; --good:#5CD08F; --scrim:rgb(0 0 0/.6); --shoe:#E9ECF3; --sole:#FF7A1A;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
html,body{height:100%}
body{font-family:var(--font);background:#EDEFF4;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:40px;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
:root[data-theme="dark"] body{background:#0A0F1A}
.side{width:270px;display:flex;flex-direction:column;gap:14px}
.side h1{font:900 28px/1.1 var(--font)}
.side p{font:600 14px/1.55 var(--font);color:var(--muted)}
.side .row{gap:8px}
.tog{display:flex;align-items:center;justify-content:space-between;font:700 14px var(--font);background:var(--bg);border-radius:14px;padding:10px 14px;border:2px solid var(--line)}
.tog input{width:20px;height:20px;accent-color:var(--brand-btn)}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ico--s{width:18px;height:18px}.ico--fill{fill:currentColor;stroke:none}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));border-radius:46px;overflow:clip;background:var(--bg);box-shadow:0 0 0 10px #fff,0 0 0 12px var(--line),0 30px 80px rgb(19 35 58/.18);isolation:isolate}
:root[data-theme="dark"] .phone{box-shadow:0 0 0 10px #1A2232,0 0 0 12px #2A3345,0 30px 80px rgb(0 0 0/.5)}
@media (max-width:760px){body{display:block;background:var(--bg)}.side{display:none}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;padding:0 34px;font:800 15px var(--font);z-index:50;pointer-events:none;color:var(--sb,var(--ink))}
@media (max-width:760px){.statusbar{display:none}}
.st{padding-top:max(50px,calc(env(safe-area-inset-top) + 8px))}
@media (max-width:760px){.st{padding-top:max(12px,env(safe-area-inset-top))}}

/* ---------- Bausteine ---------- */
.row{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.cbtn{--c:var(--brand-btn);--e:var(--brand-btn-edge);--t:var(--on-brand);position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:var(--r-m);
  background:var(--c);color:var(--t);box-shadow:0 5px 0 var(--e);font:900 18px var(--font);letter-spacing:.02em;cursor:pointer;transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;margin-bottom:5px}
.cbtn:active,.cbtn.is-down{transform:translateY(5px);box-shadow:0 0 0 var(--e)}
.cbtn:focus-visible{outline:3px solid var(--brand);outline-offset:4px}
.cbtn--ghost{--c:var(--card);--e:var(--line);--t:var(--ink);box-shadow:0 4px 0 var(--e),inset 0 0 0 2px var(--line)}
.cbtn--ghost:active{box-shadow:0 0 0 var(--e),inset 0 0 0 2px var(--line)}
.cbtn--sport{--c:var(--sport);--e:color-mix(in srgb,var(--sport) 62%,#000);--t:var(--on-sport)}
.cbtn--white{--c:#fff;--e:rgb(0 0 0/.18);--t:var(--ink)}
.cbtn--sm{min-height:42px;font-size:15px;padding:0 14px;width:auto;border-radius:var(--r-s);box-shadow:0 4px 0 var(--e);margin-bottom:4px}
.cbtn--sm:active{transform:translateY(4px)}
.cbtn--sm.cbtn--ghost{box-shadow:0 4px 0 var(--e),inset 0 0 0 2px var(--line)}
.cbtn--done{--c:var(--good-soft);--e:color-mix(in srgb,var(--good) 40%,transparent);--t:var(--good)}
.ibtn{width:48px;height:48px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none;transition:transform .15s var(--spring)}
.ibtn:active{transform:scale(.88)}
.ccard{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r-l);padding:16px;color:var(--ink);cursor:pointer;transition:transform .08s,border-bottom-width .08s,margin .08s;-webkit-tap-highlight-color:transparent}
.ccard:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:800 13px var(--font);background:var(--bg-soft);color:var(--ink);border:2px solid var(--line);white-space:nowrap}
.pill .ico{width:16px;height:16px}
.pill--sport{background:var(--sport);border-color:transparent;color:var(--on-sport)}
.wxsym{display:none}
.pill--wx{background:var(--bg-soft)}.pill--wx.rain{background:#E4EEFB;color:#1D4E89;border-color:transparent}.pill--wx.warn{background:#FFF1D6;color:#7A4A00;border-color:transparent}
[data-theme=dark] .pill--wx.rain{background:#1B2C45;color:#A9CBFF}[data-theme=dark] .pill--wx.warn{background:#3A2C10;color:#FFD48A}
.wxnote{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#E4EEFB;color:#1D4E89;font:800 14px/1.35 var(--font)}
[data-theme=dark] .wxnote{background:#1B2C45;color:#A9CBFF}
.wxnote .ico{flex:none}
.pin .pc{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--good);color:#fff;font:900 12px/18px var(--font);border:2px solid #fff;z-index:2}
.pin .pc::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--good);animation:ring 1.6s ease-out 2;opacity:0}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.calm .pin .pc::after{animation:none}
.mav{display:inline-flex;margin-right:2px}.mav .av{width:20px;height:20px;font-size:8.5px;border-width:2px;border-color:var(--good-soft)}.mav .av+.av{margin-left:-6px}
.golive{display:flex;flex-direction:column;gap:12px;margin-top:22px;text-align:left}
.golive .row{gap:12px}
.wxsel{display:flex;flex-wrap:wrap;gap:6px}.wxsel button{flex:1 1 auto;height:36px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font:800 13px var(--font);color:var(--ink);cursor:pointer}
.wxsel button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill--live{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill--live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tog-chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font:800 14px var(--font);cursor:pointer;white-space:nowrap;transition:transform .08s}
.tog-chip:active{transform:translateY(2px)}
.tog-chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--on-brand-soft)}
.tog-chip .ico{width:18px;height:18px}
.sdot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sport);color:var(--on-sport);flex:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 11px var(--font);background:var(--bg-soft);color:var(--ink);border:2.5px solid var(--card)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.av.me{background:var(--brand);color:#fff}
.h1{font:900 30px/1.08 var(--font);letter-spacing:-.01em}
.h2{font:900 22px/1.15 var(--font)}
.h3{font:900 18px/1.2 var(--font)}
.t{font:600 15px/1.45 var(--font)}
.tm{font:700 14px/1.4 var(--font);color:var(--muted)}
.cap{font:900 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 6px;margin:0 -20px}
.scrollx::-webkit-scrollbar{display:none}

/* ---------- Bolle ---------- */
.bolle{display:block;overflow:visible}
.bolle *{transform-box:fill-box}
.b-all{transform-origin:50% 100%}
.b-body{transform-origin:50% 100%}
.b-armL{transform-origin:100% 50%}.b-armR{transform-origin:0% 50%}
.b-eye{transform-origin:center;animation:blink 4.6s infinite}
.b-eye.r{animation-delay:.02s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.b-pupils{transition:transform .25s var(--ease)}
.b-mouth{transition:d .25s}
.b-shadow{transform-origin:center}
/* Posen – jede hat einen Anlass */
[data-pose="idle"] .b-body{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
[data-pose="wave"] .b-armR{animation:wave .5s ease-in-out 3 alternate}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-55deg)}}
[data-pose="wave"] .b-body{animation:hop .6s var(--spring)}
@keyframes hop{30%{transform:translateY(-10px) scale(.98,1.03)}}
[data-pose="dribble"] .b-all{animation:dribble .5s infinite}
@keyframes dribble{0%,100%{transform:translateY(-26px);animation-timing-function:cubic-bezier(.45,0,.9,.5)}50%{transform:translateY(0) scale(1.1,.88);animation-timing-function:cubic-bezier(.1,.5,.55,1)}}
[data-pose="dribble"] .b-shadow{animation:shad .5s infinite}
@keyframes shad{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.05);opacity:1}}
[data-pose="dribble"] .b-armL,[data-pose="dribble"] .b-armR{animation:flap .25s infinite alternate}
@keyframes flap{to{transform:rotate(-18deg)}}
[data-pose="cheer"] .b-all{animation:jump .8s var(--ease) infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(.95,1.06)}45%{transform:translateY(-46px)}80%{transform:translateY(0) scale(1.08,.92)}}
[data-pose="cheer"] .b-armL{transform:rotate(70deg)}[data-pose="cheer"] .b-armR{transform:rotate(-70deg)}
[data-pose="cheer"] .b-shadow{animation:shad2 .8s infinite}
@keyframes shad2{45%{transform:scale(.55);opacity:.4}}
[data-pose="sad"] .b-body{transform:translateY(6px) scale(1.04,.95);transition:transform .4s var(--ease)}
[data-pose="sad"] .b-armL{transform:rotate(-20deg)}[data-pose="sad"] .b-armR{transform:rotate(20deg)}
[data-pose="sad"] .b-band{transform:translateY(4px)}
[data-pose="think"] .b-armR{transform:rotate(-100deg)}
[data-pose="think"] .b-body{animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-4deg)}}
[data-pose="love"] .b-all{animation:hop .6s var(--spring)}
.bolle .b-heart{opacity:0}
[data-pose="love"] .b-heart{animation:heartup 1s var(--ease) forwards}
@keyframes heartup{0%{opacity:0;transform:translateY(10px) scale(.4)}30%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font:800 16px/1.35 var(--font);color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.pop{animation:bubble .45s var(--spring)}
@keyframes bubble{from{transform:scale(.6);opacity:0;transform-origin:left center}}
.say{display:flex;align-items:center;gap:6px}

/* ---------- Gerüst ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view.in{animation:vin .32s var(--ease)}
.view.back{animation:vback .32s var(--ease)}
@keyframes vin{from{transform:translateX(36%);opacity:0}}
@keyframes vback{from{transform:translateX(-24%);opacity:0}}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:110px}
.scroll::-webkit-scrollbar{display:none}
.pad{padding-left:20px;padding-right:20px}
.topbar{display:flex;align-items:center;gap:4px;padding-left:8px;padding-right:8px;flex:none;background:var(--bg);z-index:3}
.topbar .h3{flex:1}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:2px solid var(--line);padding:8px 10px max(14px,env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font:800 12px var(--font);color:var(--muted);cursor:pointer;padding:6px 0;border-radius:14px;transition:transform .15s var(--spring)}
.nav button .ico{width:28px;height:28px}
.nav button[aria-current]{color:var(--brand-btn)}
.nav button[aria-current] .ico{animation:navpop .4s var(--spring)}
@keyframes navpop{40%{transform:scale(1.25) rotate(-6deg)}}
.nav button:active{transform:scale(.9)}
.badge{position:absolute;margin:-6px 0 0 18px;min-width:18px;height:18px;border-radius:9px;background:var(--brand-btn);color:#fff;font:900 11px/18px var(--font);text-align:center;padding:0 4px}

/* Start */
.homehead{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);font:900 16px var(--font);color:var(--brand-btn);background:var(--card);cursor:pointer}
.streak .ico{width:22px;height:22px}
.loc{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);font:800 14px var(--font);background:var(--card);cursor:pointer;max-width:220px}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.greet{display:flex;align-items:center;gap:6px;margin:18px 0 18px}
.greet .bolle{width:118px;flex:none;margin-left:-8px}
.again{display:flex;align-items:center;gap:14px;text-align:left;justify-content:flex-start;min-height:76px;padding:0 16px}
.again .sdot{background:rgb(255 255 255/.25);color:#fff;width:46px;height:46px}
.again b{display:block;font:900 19px var(--font)}
.again small{display:block;font:800 13px var(--font);opacity:.9;letter-spacing:0}
.again .ico.go{margin-left:auto}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.sgrid .ccard{display:flex;flex-direction:column;gap:10px;padding:14px}
.sgrid .ccard b{font:900 16px var(--font)}
.sgrid .ccard small{font:700 13px var(--font);color:var(--muted)}
.livecard{display:flex;align-items:center;gap:12px;margin-top:22px}
.livecard .avs{flex:none}

/* Ergebnisse */
.say--small .bolle{width:72px;flex:none;margin-left:-6px}
.say--small .bubble{font-size:15px}
.tip{border-color:var(--sport);background:var(--card);position:relative;margin-top:6px}
.tip__flag{position:absolute;top:-13px;left:14px;height:26px;padding:0 10px;border-radius:8px;background:var(--sport);color:var(--on-sport);font:900 12px/26px var(--font);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tip__flag .ico{width:15px;height:15px}
.place{display:flex;gap:12px;align-items:flex-start}
.place__main{flex:1;min-width:0}
.place__name{font:900 17px/1.25 var(--font)}
.place__sub{font:700 13.5px/1.35 var(--font);color:var(--muted);margin-top:2px}
.place__dist{font:900 16px var(--font);text-align:right;white-space:nowrap}
.place__dist small{display:block;font:700 12px var(--font);color:var(--muted)}
.place__tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.list{display:flex;flex-direction:column;gap:12px}
.list>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.seg{display:flex;background:var(--bg-soft);border:2px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:none;height:36px;padding:0 14px;border-radius:10px;font:800 14px var(--font);color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.map{position:relative;height:420px;border-radius:var(--r-l);overflow:hidden;border:2px solid var(--line);background:var(--bg-soft)}
.map svg.art{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:40px;height:40px;transform:translate(-50%,-100%);border:0;background:none;cursor:pointer;animation:pin .5s var(--spring) both;animation-delay:calc(var(--i)*60ms)}
.pin i{position:absolute;inset:0;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--sport);box-shadow:0 0 0 3px #fff,0 4px 0 3px rgb(0 0 0/.12)}
.pin .ico{position:relative;width:20px;height:20px;color:var(--on-sport);margin:6px auto 0;display:block}
.pin.on i{background:var(--ink)}.pin.on .ico{color:#fff}
.pin.on{transform:translate(-50%,-100%) scale(1.15);z-index:3}
@keyframes pin{from{transform:translate(-50%,-260%);opacity:0}}
.medot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--brand-btn);transform:translate(-50%,-50%);box-shadow:0 0 0 4px #fff}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px}
.empty{text-align:center;padding:12px 0}
.empty .bolle{width:140px;margin:0 auto}

/* Ort */
.ptop{background:var(--sport);color:var(--on-sport);border-radius:0 0 var(--r-xl) var(--r-xl);padding-bottom:22px;flex:none}
.ptop .ibtn{color:var(--on-sport)}
.ptop .pill{background:rgb(255 255 255/.45);border-color:transparent;color:var(--on-sport)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.facts .pill{height:34px;font-size:14px}
.sect{margin-top:26px}
.sect>.row:first-child{margin-bottom:10px}
.who{display:flex;flex-direction:column;gap:10px;margin:12px 0 16px}
.who .row{gap:12px}
.who .av{width:36px;height:36px;font-size:12px;border:0}
.who .av.new{animation:avpop .6s var(--spring)}
@keyframes avpop{from{transform:scale(0)}}
.rnd{display:flex;align-items:center;gap:12px}
.rnd+.rnd{margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.rnd .sdot{width:40px;height:40px;border-radius:12px}
.heartbtn.pop .ico{animation:heart .45s var(--spring)}
@keyframes heart{40%{transform:scale(1.45)}}
.bottomcta{position:absolute;left:0;right:0;bottom:0;padding:14px 20px max(20px,env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line);z-index:5}
.field{display:flex;align-items:center;gap:10px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--bg-soft);padding:0 14px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 16px var(--font)}
.field:focus-within{border-color:var(--brand)}

/* Sheets */
.modal{position:absolute;inset:0;z-index:60;visibility:hidden}
.modal.open{visibility:visible}
.modal .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.modal.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 60px);background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 20px max(22px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s var(--spring);display:flex;flex-direction:column;gap:18px;overflow-y:auto;scrollbar-width:none}
.modal.open .sheet{transform:none}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font:900 17px var(--font);cursor:pointer;text-align:left;transition:transform .08s}
.opt small{display:block;font:700 13px var(--font);color:var(--muted)}
.opt:active{transform:translateY(2px)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line-strong);display:grid;place-items:center}
.opt[aria-pressed="true"] .chk{background:var(--brand-btn);border-color:var(--brand-btn);color:#fff}
.lvl{display:flex;gap:8px}
.lvl .tog-chip{flex:1;justify-content:center}
.sgrid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sgrid3 .opt{min-width:0;line-height:1.15}
.sgrid3 .opt{min-height:56px;font-size:15px;gap:10px;padding:0 12px}
.sgrid3 .sdot{width:32px;height:32px;border-radius:10px}
.sgrid3 .sdot .ico{width:18px;height:18px}

/* Feier */
.party{position:absolute;inset:0;z-index:80;background:var(--sport);color:var(--on-sport);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;visibility:hidden;clip-path:circle(0 at 50% 85%);transition:clip-path .5s cubic-bezier(.7,0,.2,1),visibility 0s .5s}
.party.open{visibility:visible;clip-path:circle(150% at 50% 85%);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}
.party .bolle{width:190px}
.party .h1{font-size:34px;margin-top:8px}
.party .t{font-size:17px;font-weight:700;margin-top:6px}
.streakbig{display:flex;align-items:center;gap:10px;margin:22px 0 6px;padding:12px 18px;border-radius:18px;background:rgb(255 255 255/.4);font:900 20px var(--font)}
.streakbig b{font-size:30px;display:inline-block}
.streakbig b.bump{animation:bump .6s var(--spring)}
@keyframes bump{40%{transform:scale(1.6)}}
.party .cbtn{margin-top:28px;max-width:340px}
.party .t.small{font-size:15px;opacity:.85}
.loader{position:absolute;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.loader.open{opacity:1;visibility:visible;transition:opacity .15s}
.loader .bolle{width:150px}
.confetti{position:absolute;inset:0;z-index:85;pointer-events:none;width:100%;height:100%}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:90;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;font:800 15px var(--font);transform:translateY(20px);opacity:0;transition:transform .3s var(--spring),opacity .2s;pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast .bolle{width:40px;flex:none}
.toast button{margin-left:auto;border:0;background:none;color:var(--brand);font:900 14px var(--font);cursor:pointer}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ===== Echte App ===== */
body{overflow:hidden}
.side,.statusbar{display:none!important}
.st{padding-top:max(14px,calc(env(safe-area-inset-top) + 6px))!important}
@media (min-width:761px){body{gap:0}}
.brandmark{font:900 22px var(--font);color:var(--brand-btn);letter-spacing:-.01em}
.foot{font-size:12px;text-align:center;margin-top:22px;opacity:.8}
a.cbtn{text-decoration:none}
.lmap{height:max(380px,calc(100dvh - 250px))}
#lmap{position:absolute;inset:0;z-index:1;background:var(--bg-soft)}
.lmap .mapcard{z-index:500}
.lpin{position:relative;display:block;width:40px;height:40px}
.lpin i{position:absolute;inset:0;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--sport);box-shadow:0 0 0 3px #fff,0 4px 0 3px rgb(0 0 0/.12)}
.lpin .ico{position:relative;width:20px;height:20px;color:var(--on-sport);margin:9px auto 0;display:block}
.lpin.on i{background:var(--ink)}.lpin.on .ico{color:#fff}
.lpin .pc{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--good);color:#fff;font:900 12px/18px var(--font);border:2px solid #fff;text-align:center}
.leaflet-marker-icon .medot{position:static;display:block;width:18px;height:18px;border-radius:50%;background:#3D8BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgb(61 139 255/.25);transform:none}
.leaflet-control-attribution{font:600 10px var(--font)!important}
dl.infos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:700 14px/1.4 var(--font)}
dl.infos dt{color:var(--muted)}dl.infos dd{overflow-wrap:anywhere}
.lnk{display:flex;align-items:center;gap:6px;margin-top:12px;font:800 14px var(--font);color:var(--brand-btn);text-decoration:none}
.soc-err{color:var(--bad);font:800 14px var(--font)}.soc-err:empty{display:none}
</style>

async function geocode(q){
  const key=Object.keys(ORTE).find(o=>o.toLowerCase()===q.toLowerCase().trim());
  if(key)return {lat:ORTE[key][0],lon:ORTE[key][1],label:key};
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&accept-language=de&q="+encodeURIComponent(q));
  if(!r.ok)throw new Error("geo");
  const j=await r.json(); if(!j.length)return null;
  return {lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name.split(",").slice(0,2).join(",")};
}

const ENDPOINTS=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
const OSM_TIMEOUT=12000; // danach zeigt die App die übrigen Daten ohne OSM
async function overpass(sportKey,lat,lon,radiusKm){
  const S=SPORTS[sportKey],ar=`(around:${Math.round(radiusKm*1000)},${lat.toFixed(5)},${lon.toFixed(5)})`;
  const parts=[`nwr["sport"~"^(.*;)?(${S.osm})(;.*)?$"]${ar};`];
  (S.extra||[]).forEach(f=>parts.push(`nwr${f}${ar};`));
  if(S.name)["leisure","amenity","club"].forEach(k=>parts.push(`nwr["name"~"${S.name}",i]["${k}"]${ar};`));
  const q=`[out:json][timeout:20];(${parts.join("")});out center tags 400;`;
  // alle Server gleichzeitig fragen, der erste mit Antwort gewinnt
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),OSM_TIMEOUT);
  try{
    return await Promise.any(ENDPOINTS.map(async ep=>{
      const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});
      if(!r.ok)throw new Error("HTTP "+r.status);
      return (await r.json()).elements||[];
    }));
  }catch(e){throw new Error("overpass")}
  finally{clearTimeout(timer);ctl.abort()}
}

  if(t.club==="sport"||t.club)return "verein";

  if(["pitch","track","playground","fitness_station","bathing_place"].includes(t.leisure)){
    if(["private","members","no"].includes(t.access))return "verein";
    if(t.fee==="yes")return "buchbar";
    return "platz";
  }
  return "buchbar";
}

const DATA_BASE="data/"; // liegt neben der App (GitHub Pages)

    for(let b=Math.floor((lon-dLon)/T);b<=Math.floor((lon+dLon)/T);b++){const k=a+"_"+b;if(idx.tiles[k])keys.push(k)}
  const rows=(await Promise.all(keys.map(async k=>{
    if(!OPEN.tiles.has(k))OPEN.tiles.set(k,fetch(DATA_BASE+"tiles/"+k+".json").then(r=>r.ok?r.json():[]).catch(()=>[]));
    return OPEN.tiles.get(k);
  }))).flat();

    const [name,la,lo,sports,type,web,tel,addr,src]=r,info={};

  const out=osm.map(x=>({...x,src:"OpenStreetMap"}));
  for(const o of open){
    const k=normName(o.name);
    const twin=out.find(x=>{const d=km(x.lat,x.lon,o.lat,o.lon)*1000;
      if(d>200)return false; const xk=normName(x.name);
      return (k&&xk&&(xk===k||(k.length>5&&(xk.includes(k)||k.includes(xk)))))||(!x.named&&d<40)});

      if(o.type==="verein")twin.type="verein";

    for(let b=Math.floor((lon-dLon)/T);b<=Math.floor((lon+dLon)/T);b++){const k=a+"_"+b;if(idx.tiles[k])keys.push(k)}

function confetti(k){if(calm())return;const c=$("#confetti"),ph=$("#phone"),W=ph.clientWidth,Hh=ph.clientHeight;c.width=W*2;c.height=Hh*2;const x=c.getContext("2d");x.setTransform(2,0,0,2,0,0);
  const cs=getComputedStyle(document.documentElement),col=["#FF7A1A","#13233A","#FFFFFF","#FFD84D",cs.getPropertyValue("--s-"+k).trim()||"#2EBD6B"];
  const P=Array.from({length:120},(_,i)=>({x:i%2?-10:W+10,y:Hh*.55,vx:(i%2?1:-1)*(Math.random()*9+4),vy:-Math.random()*14-6,w:Math.random()*8+5,h:Math.random()*5+3,a:Math.random()*6,va:(Math.random()-.5)*.5,c:col[i%col.length]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,W,Hh);P.forEach(p=>{p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(t-t0<2600)requestAnimationFrame(f);else x.clearRect(0,0,W,Hh)})(t0)}

  sheet(`<div class="h2">Was stimmt nicht?</div><p class="tm" style="margin-top:-6px">${esc(p.name)}</p>
   <div class="opts" id="rpOpts">${[["sportart","Falsche Sportart",`Hier kann man kein ${esc(sportName(v.k))} machen`],["gibts_nicht","Gibt's nicht (mehr)","Geschlossen, abgerissen oder nie da gewesen"],["sonstiges","Etwas anderes","Name, Adresse, Art des Orts …"]]
     .map(([k,t,d])=>`<button class="opt" data-rp="${k}" aria-pressed="false"><span><span>${t}</span><small>${d}</small></span><span class="chk">${I("check","ico--s")}</span></button>`).join("")}</div>
   <div class="field"><input id="rpNote" maxlength="200" placeholder="Kurz erklären (optional)" aria-label="Kurz erklären"></div>
   <p class="soc-err" id="rpErr" role="alert"></p><button class="cbtn" id="rpGo" disabled>Melden</button>`)}
async function sendReport(){if(!rp||!rp.kind)return;const b=$("#rpGo");b.disabled=true;
  const row={place_id:rp.p.id,place_name:String(rp.p.name).slice(0,120),lat:+rp.p.lat.toFixed(5),lon:+rp.p.lon.toFixed(5),sport:rp.k,kind:rp.kind,note:($("#rpNote").value||"").trim().slice(0,200)||null,device:SOC.dev};
  try{if(SOC.live){const r=await fetch(SB.url.replace(/\/$/,"")+"/rest/v1/reports",{method:"POST",body:JSON.stringify(row),headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json",Prefer:"return=minimal"}});if(!r.ok)throw 0}
    else{const a=LOCAL.get("reports");a.push(row);LOCAL.put("reports",a)}
    closeSheet();toast("Danke! Wir schauen uns das an.","love")}
  catch(e){b.disabled=false;$("#rpErr").textContent="Hat nicht geklappt – bitte später noch einmal versuchen."}}

/* ---------- Klicks ---------- */
document.addEventListener("click",e=>{const t=e.target;
  if(t.closest("[data-close]")){closeSheet();return}
  const tab=t.closest("[data-tab]");if(tab){closeSheet();$("#party").classList.remove("open");setTab(tab.dataset.tab);return}
  const sp=t.closest("[data-sport]");if(sp){closeSheet();openSport(sp.dataset.sport);return}
  const qk=t.closest("[data-quick]");if(qk){const id=qk.dataset.quick;openPlace(id,qk.dataset.k);if(!todayOf(PLC.get(id)).some(x=>x.me))openCheckin();return}
  const op=t.closest("[data-open]");if(op){openPlace(op.dataset.open,op.dataset.k);return}
  const vw=t.closest("[data-view]");if(vw){S.view=vw.dataset.view;repaintTop();return}
  const fl=t.closest("[data-flag]");if(fl){S.f[fl.dataset.flag]=!S.f[fl.dataset.flag];S.more=40;repaintTop();return}
  const jn=t.closest("[data-join]");if(jn){doJoin(jn.dataset.join);return}
  const ckb=t.closest("[data-ck]");if(ckb){ck.opt=ck.opts[+ckb.dataset.ck];$$("#ckOpts .opt").forEach(b=>b.setAttribute("aria-pressed",b===ckb));ckWx();return}
  const lv=t.closest("[data-lv]");if(lv){ck.lv=lv.dataset.lv;$$("#ckLvl .tog-chip").forEach(b=>b.setAttribute("aria-pressed",b===lv));return}
  for(const a of ["r","day","time"]){const x=t.closest(`[data-${a}]`);if(x&&x.closest("#sheet")){$$(`#sheet [data-${a}]`).forEach(b=>b.setAttribute("aria-pressed",b===x));return}}
  const rk=t.closest("[data-rp]");if(rk){rp.kind=rk.dataset.rp;$$("#rpOpts .opt").forEach(b=>b.setAttribute("aria-pressed",b===rk));$("#rpGo").disabled=false;return}
  if(t.closest("#rpGo")){sendReport();return}
  if(t.closest("#ckGo")){doCheckin();return}
  if(t.closest("#nrGo")){doRound();return}
  if(t.closest("#placeGo")){placeDone();return}
  const a=t.closest("[data-act]");if(!a)return;const act=a.dataset.act,v=S.stack.at(-1);
  if(act==="back")back();
  if(act==="place")openPlaceSheet();
  if(act==="geo")useGeo();
  if(act==="allsports")openAllSports();
  if(act==="retry")openSport(state.sport);
  if(act==="more"){S.more+=40;repaintTop()}
  if(act==="wider"){if(state.radius>=15){openPlaceSheet();return}state.radius=RADII[RADII.indexOf(state.radius)+1];store.set("sf_r",state.radius);reloadTop()}
  if(act==="clearf"){S.f={free:false,lit:false,covered:false,noschool:false};repaintTop()}
  if(act==="checkin")openCheckin();
  if(act==="report")openReport();
  if(act==="newround")newRound();
  if(act==="save"){const p=PLC.get(v.id),had=FAV.has(p.id);FAV.toggle({...p,sport:v.k});repaintTop();if(!had){$(".heartbtn")?.classList.add("pop");SND.heart();toast("Gemerkt!","love")}else toast("Aus Gemerkt entfernt.","idle",()=>{FAV.toggle({...p,sport:v.k});repaintTop()})}
  if(act==="share")share(PLC.get(v.id));
  if(act==="partyclose"){$("#party").classList.remove("open");repaintTop()}
});
document.addEventListener("submit",async e=>{if(e.target.id!=="tipForm")return;e.preventDefault();const val=$("#tipIn").value.trim().slice(0,140);if(!val)return;const v=S.stack.at(-1),p=PLC.get(v.id);
  try{await API.add("tips",{...baseRow(p,v.k),text:val});await socReload();repaintTop();toast("Danke für deinen Tipp!","love")}catch(err){toast("Hat nicht geklappt – bitte nochmal.","sad")}});
const DARK=matchMedia("(prefers-color-scheme: dark)");const theme=()=>{document.documentElement.dataset.theme=DARK.matches?"dark":""};theme();DARK.addEventListener("change",()=>{theme();repaintTop()});

setTab("home");
ensureCenter().then(()=>{repaintTop();if(new URLSearchParams(location.search).get("s"))openSport(state.sport)});
setInterval(()=>{if(document.visibilityState==="visible"&&state.center){SOC.key="";socEnsure()}},120000);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
